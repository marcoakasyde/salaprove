<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sala Prove</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 20px; background: #f4f4f9; }
    .hidden { display: none; }
    button { padding: 12px 20px; font-size: 16px; margin: 10px; cursor: pointer; border: none; border-radius: 8px; }
    .btn-a { background: #2196F3; color: white; }
    .btn-b { background: #E91E63; color: white; }
    
    /* Calendario Griglia */
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; max-width: 400px; margin: 20px auto; }
    .day { padding: 15px; border: 1px solid #ccc; border-radius: 6px; background: white; font-weight: bold; }
    .day.libero { background: #e0e0e0; cursor: pointer; }
    .day.gruppo-a { background: #2196F3; color: white; }
    .day.gruppo-b { background: #E91E63; color: white; }
    .day.disabilitato { cursor: not-allowed; opacity: 0.8; }
  </style>
</head>
<body>

  <!-- Schermata di selezione iniziale -->
  <div id="seleziona-gruppo">
    <h2>Di quale gruppo fai parte?</h2>
    <button class="btn-a" onclick="scegliGruppo('A')">Gruppo A</button>
    <button class="btn-b" onclick="scegliGruppo('B')">Gruppo B</button>
  </div>

  <!-- Schermata principale Calendario -->
  <div id="app" class="hidden">
    <h3 id="info-gruppo"></h3>
    <button onclick="cambiaGruppo()" style="font-size:12px; background:#888; color:white;">Cambia Gruppo</button>
    <div class="grid" id="calendario"></div>
  </div>

  <script>
    // INSERISCI QUI I TUOI DATI DI SUPABASE
    const SUPABASE_URL = "LA_TUA_URL_SUPABASE";
    const SUPABASE_KEY = "LA_TUA_KEY_ANONIMA_SUPABASE";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let mioGruppo = localStorage.getItem('gruppo_sala_prove');

    function init() {
      if (mioGruppo) {
        document.getElementById('seleziona-gruppo').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        document.getElementById('info-gruppo').innerText = "Sei nel Gruppo " + mioGruppo;
        caricaCalendario();
      }
    }

    function scegliGruppo(g) {
      localStorage.setItem('gruppo_sala_prove', g);
      mioGruppo = g;
      init();
    }

    function cambiaGruppo() {
      localStorage.removeItem('gruppo_sala_prove');
      location.reload();
    }

    async function caricaCalendario() {
      const { data: prenotazioni } = await supabase.from('prenotazioni').select('*');
      const mappaPrenotazioni = {};
      (prenotazioni || []).forEach(p => mappaPrenotazioni[p.data] = p.gruppo);

      const cal = document.getElementById('calendario');
      cal.innerHTML = '';
      
      // Esempio per i prossimi 30 giorni
      const oggi = new Date();
      for (let i = 0; i < 30; i++) {
        const d = new Date();
        d.setDate(oggi.getDate() + i);
        const dataStr = d.toISOString().split('T')[0];
        const giornoNum = d.getDate();

        const el = document.createElement('div');
        el.className = 'day';
        el.innerText = giornoNum;

        const occupatoDa = mappaPrenotazioni[dataStr];

        if (!occupatoDa) {
          el.classList.add('libero');
          el.onclick = () => prenota(dataStr);
        } else if (occupatoDa === 'A') {
          el.classList.add('gruppo-a');
          if (mioGruppo === 'A') el.onclick = () => libera(dataStr);
          else el.classList.add('disabilitato');
        } else if (occupatoDa === 'B') {
          el.classList.add('gruppo-b');
          if (mioGruppo === 'B') el.onclick = () => libera(dataStr);
          else el.classList.add('disabilitato');
        }

        cal.appendChild(el);
      }
    }

    async function prenota(dataStr) {
      await supabase.from('prenotazioni').insert([{ data: dataStr, gruppo: mioGruppo }]);
      caricaCalendario();
    }

    async function libera(dataStr) {
      await supabase.from('prenotazioni').delete().eq('data', dataStr);
      caricaCalendario();
    }

    init();
  </script>
</body>
</html>
