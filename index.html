<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Calendario Sala Prove v1.4</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --text-main: #e0e0e0;
      --accent-a: #ffffff;
      --accent-a-text: #111111;
      --accent-b: #ff9800;
      --accent-b-text: #000000;
      --free-slot: #666666;
      --past-a-bg: #bbbbbb;
      --past-a-text: #222222;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.2rem;
      margin: 0;
      font-weight: 600;
    }

    .group-selector {
      background: var(--card-bg);
      border: 1px solid #333;
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .nav-month {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .nav-btn {
      background: var(--card-bg);
      border: 1px solid #333;
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .month-title {
      font-size: 1.1rem;
      font-weight: 600;
      text-transform: capitalize;
    }

    .calendar-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      touch-action: pan-y;
      overflow: hidden;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .day.empty {
      background: transparent;
    }

    /* STATI GIORNI FUTURI E OGGI */
    .day.libero {
      background: var(--free-slot);
      color: #ffffff;
      cursor: pointer;
    }

    .day.gruppo-a {
      background: var(--accent-a) !important;
      color: var(--accent-a-text) !important;
      cursor: pointer;
    }

    .day.gruppo-b {
      background: var(--accent-b) !important;
      color: var(--accent-b-text) !important;
      cursor: pointer;
    }

    /* FIX SPECIFICO V1.4: GIORNI PASSATI */
    .day.passato {
      opacity: 0.45;
      cursor: not-allowed !important;
      background: #2a2a2a !important;
      color: #666666 !important;
    }

    /* Distinzione giorno passato prenotato dal Gruppo A */
    .day.passato.gruppo-a {
      background: var(--past-a-bg) !important;
      color: var(--past-a-text) !important;
      opacity: 0.75 !important;
    }

    /* Distinzione giorno passato prenotato dal Gruppo B */
    .day.passato.gruppo-b {
      background: #b36b00 !important;
      color: #ffffff !important;
      opacity: 0.6 !important;
    }

    .day:active:not(.empty):not(.passato) {
      transform: scale(0.92);
    }

    .info-box {
      margin-top: 20px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      font-size: 0.85rem;
      border: 1px solid #2a2a2a;
    }

    .legend {
      display: flex;
      justify-content: space-around;
      margin-top: 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    /* MODALE CUSTOM SCURA (V1.4) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 20px;
      width: 85%;
      max-width: 320px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.8);
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.2s ease;
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .modal-body {
      font-size: 0.9rem;
      color: #aaaaaa;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-btn {
      flex: 1;
      padding: 10px 0;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .modal-btn-cancel {
      background: #2c2c2c;
      color: #e0e0e0;
    }

    .modal-btn-confirm {
      background: #e53935;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Sala Prove</h1>
      <select id="groupSelect" class="group-selector" onchange="changeGroup(this.value)">
        <option value="A">Nexus Opera</option>
        <option value="B">Black Jett</option>
      </select>
    </header>

    <div class="nav-month">
      <button class="nav-btn" onclick="prevMonth()">← Prec</button>
      <div id="monthTitle" class="month-title"></div>
      <button class="nav-btn" onclick="nextMonth()">Succ →</button>
    </div>

    <div class="calendar-card" id="calendarCard">
      <div class="weekdays">
        <div>LUN</div><div>MAR</div><div>MER</div><div>GIO</div><div>VEN</div><div>SAB</div><div>DOM</div>
      </div>
      <div id="daysGrid" class="days-grid"></div>
    </div>

    <div class="info-box">
      <div class="legend">
        <div class="legend-item"><div class="dot" style="background: var(--accent-a)"></div> Nexus Opera</div>
        <div class="legend-item"><div class="dot" style="background: var(--accent-b)"></div> Black Jett</div>
        <div class="legend-item"><div class="dot" style="background: var(--free-slot)"></div> Libero</div>
      </div>
    </div>
  </div>

  <!-- MODALE SCURA CUSTOM (V1.4) -->
  <div id="customModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-title" id="modalTitle">Conferma cancellazione</div>
      <div class="modal-body" id="modalBody">Vuoi liberare questa data?</div>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Annulla</button>
        <button class="modal-btn modal-btn-confirm" id="modalConfirmBtn">Elimina</button>
      </div>
    </div>
  </div>

  <script>
    // CONFIGURAZIONE SUPABASE
    const SUPABASE_URL = 'https://YOUR-SUPABASE-URL.supabase.co';
    const SUPABASE_KEY = 'YOUR-SUPABASE-ANON-KEY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentDate = new Date();
    let currentGroup = localStorage.getItem('sala_prove_group') || 'A';
    let bookingsCache = {};
    let pendingDateToCancel = null;

    document.getElementById('groupSelect').value = currentGroup;

    // INIT & LISTENERS REALTIME
    async function init() {
      renderCalendar();
      await fetchBookings();
      setupRealtime();
      setupSwipeEvents();
    }

    function changeGroup(val) {
      currentGroup = val;
      localStorage.setItem('sala_prove_group', val);
      renderCalendar();
    }

    function prevMonth() {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
      fetchBookings();
    }

    function nextMonth() {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
      fetchBookings();
    }

    // SWIPE HORIZONAL NAVIGATION (V1.3.5)
    function setupSwipeEvents() {
      const card = document.getElementById('calendarCard');
      let touchStartX = 0;
      let touchEndX = 0;

      card.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      card.addEventListener('touchend', e => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
      }, { passive: true });

      function handleSwipe() {
        const threshold = 40;
        if (touchStartX - touchEndX > threshold) nextMonth();
        if (touchEndX - touchStartX > threshold) prevMonth();
      }
    }

    // CARICAMENTO & RENDER
    async function fetchBookings() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth() + 1;
      const startStr = `${year}-${String(month).padStart(2, '0')}-01`;
      const endStr = `${year}-${String(month).padStart(2, '0')}-${new Date(year, month, 0).getDate()}`;

      const { data, error } = await supabase
        .from('prenotazioni')
        .select('*')
        .gte('data', startStr)
        .lte('data', endStr);

      if (!error && data) {
        bookingsCache = {};
        data.forEach(b => { bookingsCache[b.data] = b.gruppo; });
        renderCalendar();
      }
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById('monthTitle').innerText = 
        new Date(year, month).toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });

      const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
      const totalDays = new Date(year, month + 1, 0).getDate();
      const todayStr = new Date().toISOString().split('T')[0];

      const grid = document.getElementById('daysGrid');
      grid.innerHTML = '';

      for (let i = 0; i < firstDayIndex; i++) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'day empty';
        grid.appendChild(emptyDiv);
      }

      for (let day = 1; day <= totalDays; day++) {
        const dayDiv = document.createElement('div');
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        
        dayDiv.className = 'day';
        dayDiv.innerText = day;

        const isPast = dateStr < todayStr;
        const bookedBy = bookingsCache[dateStr];

        if (isPast) dayDiv.classList.add('passato');
        
        if (bookedBy === 'A') dayDiv.classList.add('gruppo-a');
        else if (bookedBy === 'B') dayDiv.classList.add('gruppo-b');
        else if (!isPast) dayDiv.classList.add('libero');

        if (!isPast) {
          dayDiv.onclick = () => handleDayClick(dateStr, bookedBy);
        }

        grid.appendChild(dayDiv);
      }
    }

    // GESTIONE TAP & MODALE SCURA CUSTOM
    function handleDayClick(dateStr, bookedBy) {
      if (!bookedBy) {
        // Prenotazione diretta
        saveBooking(dateStr, currentGroup);
      } else if (bookedBy === currentGroup) {
        // Apertura Modale Scura Custom per la cancellazione
        openModal(dateStr);
      }
    }

    function openModal(dateStr) {
      pendingDateToCancel = dateStr;
      const formattedDate = new Date(dateStr).toLocaleDateString('it-IT', { day: 'numeric', month: 'long' });
      document.getElementById('modalBody').innerText = `Vuoi cancellare la prenotazione per ${formattedDate}?`;
      
      const confirmBtn = document.getElementById('modalConfirmBtn');
      confirmBtn.onclick = () => {
        closeModal();
        if (pendingDateToCancel) saveBooking(pendingDateToCancel, null);
      };

      document.getElementById('customModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('customModal').classList.remove('active');
      pendingDateToCancel = null;
    }

    async function saveBooking(dateStr, group) {
      if (group) {
        await supabase.from('prenotazioni').upsert({ data: dateStr, gruppo: group });
      } else {
        await supabase.from('prenotazioni').delete().eq('data', dateStr);
      }
      fetchBookings();
    }

    function setupRealtime() {
      supabase
        .channel('schema-db-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'prenotazioni' }, () => {
          fetchBookings();
        })
        .subscribe();
    }

    init();
  </script>
</body>
</html>
